name: preview examples diff

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  generate-diff:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Set up node env
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Create .env file
        run: |
          echo -e "NB_API_QUERY_URL=https://federate.neurobagel.org/\nNB_ENABLE_AUTH=true\nNB_QUERY_CLIENT_ID=mockclientid" > .env

      - name: Build
        run: npm install && npm run build

      - name: Run Cypress tests to generate example TSVs
        uses: cypress-io/github-action@v7
        with:
          wait-on: http://localhost:5173
          start: npm run preview
          spec: cypress/e2e/UpdateExamples.cy.ts
          component: false

      - name: Normalize generated TSV names
        run: |
          mv cypress/downloads/neurobagel-query-results_*.tsv cypress/downloads/neurobagel-query-results_YYYYMMDDHHMMSS.tsv
          mv cypress/downloads/neurobagel-query-results-with-URIs_*.tsv cypress/downloads/neurobagel-query-results-with-URIs_YYYYMMDDHHMMSS.tsv

      - name: Checkout reference TSVs from neurobagel_examples
        uses: actions/checkout@v7
        with:
          repository: neurobagel/neurobagel_examples
          ref: main
          path: reference_examples

      - name: Compute diff
        run: |
          mkdir -p diff-artifact
          echo "${{ github.event.pull_request.number }}" > diff-artifact/pr_number.txt

          mkdir -p generated_examples/query-tool-results
          cp cypress/downloads/neurobagel-query-results_YYYYMMDDHHMMSS.tsv generated_examples/query-tool-results/
          cp cypress/downloads/neurobagel-query-results-with-URIs_YYYYMMDDHHMMSS.tsv generated_examples/query-tool-results/

          diff -U 0 --label "reference/neurobagel-query-results.tsv" --label "generated/neurobagel-query-results.tsv" \
            reference_examples/query-tool-results/neurobagel-query-results_YYYYMMDDHHMMSS.tsv \
            generated_examples/query-tool-results/neurobagel-query-results_YYYYMMDDHHMMSS.tsv \
            > diff-artifact/results.diff || true

          diff -U 0 --label "reference/neurobagel-query-results-with-URIs.tsv" --label "generated/neurobagel-query-results-with-URIs.tsv" \
            reference_examples/query-tool-results/neurobagel-query-results-with-URIs_YYYYMMDDHHMMSS.tsv \
            generated_examples/query-tool-results/neurobagel-query-results-with-URIs_YYYYMMDDHHMMSS.tsv \
            > diff-artifact/results_uris.diff || true

          if [ -s diff-artifact/results.diff ] || [ -s diff-artifact/results_uris.diff ]; then
            echo "has_diff=true" > diff-artifact/diff_status.txt
          else
            echo "has_diff=false" > diff-artifact/diff_status.txt
          fi

      - name: Upload diff artifact
        uses: actions/upload-artifact@v7
        with:
          name: examples-diff-artifact
          path: diff-artifact/

      - name: Generate comment markdown
        id: prep
        run: |
          echo "pr_number=$(cat diff-artifact/pr_number.txt)" >> "$GITHUB_OUTPUT"
          COMMENT_FILE="diff-artifact/comment.md"

          if [ "$(cat diff-artifact/diff_status.txt)" = "has_diff=true" ]; then
            {
              echo ""
              echo "⚠️ **Changes detected** in the query tool results TSV compared to \`neurobagel_examples:main\`:"

              if [ -s diff-artifact/results.diff ]; then
                echo ""
                echo "<details open>"
                echo "<summary><b>📄 neurobagel-query-results.tsv</b></summary>"
                echo ""
                echo '```diff'
                if [ $(wc -c < diff-artifact/results.diff) -gt 25000 ]; then
                  head -c 25000 diff-artifact/results.diff
                  echo ""
                  echo "... [Diff truncated due to size limit. View workflow artifacts for full diff]"
                else
                  cat diff-artifact/results.diff
                fi
                echo '```'
                echo "</details>"
              fi

              if [ -s diff-artifact/results_uris.diff ]; then
                echo ""
                echo "<details open>"
                echo "<summary><b>📄 neurobagel-query-results-with-URIs.tsv</b></summary>"
                echo ""
                echo '```diff'
                if [ $(wc -c < diff-artifact/results_uris.diff) -gt 25000 ]; then
                  head -c 25000 diff-artifact/results_uris.diff
                  echo ""
                  echo "... [Diff truncated due to size limit. View workflow artifacts for full diff]"
                else
                  cat diff-artifact/results_uris.diff
                fi
                echo '```'
                echo "</details>"
              fi
            } > "$COMMENT_FILE"
          else
            {
              echo ""
              echo "✅ **No changes detected** in the query tool results TSV compared to \`neurobagel_examples:main\`."
            } > "$COMMENT_FILE"
          fi

      - name: Generate a token
        id: generate-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.NB_BOT_ID }}
          private-key: ${{ secrets.NB_BOT_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Post or update PR comment
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          GITHUB_TOKEN: ${{ steps.generate-token.outputs.token }}
          header: query-tool-examples-diff-preview
          number: ${{ steps.prep.outputs.pr_number }}
          path: diff-artifact/comment.md

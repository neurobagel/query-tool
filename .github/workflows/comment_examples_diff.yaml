name: comment examples diff

on:
  workflow_run:
    workflows: ["preview examples diff"]
    types:
      - completed

permissions:
  actions: read
  pull-requests: write
  issues: write

jobs:
  post-comment:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: examples-diff-artifact
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: diff-artifact

      - name: Post or update PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            const prNumber = parseInt(fs.readFileSync('diff-artifact/pr_number.txt', 'utf8').trim(), 10);
            const hasDiff = fs.readFileSync('diff-artifact/diff_status.txt', 'utf8').trim() === 'has_diff=true';

            const commentHeader = '<!-- query-tool-examples-diff-preview -->\n### 📊 Example Results Diff Preview';
            let commentBody = '';

            if (hasDiff) {
              let diffContent = fs.readFileSync('diff-artifact/combined.diff', 'utf8');
              if (diffContent.length > 50000) {
                diffContent = diffContent.substring(0, 50000) + '\n\n... [Diff truncated due to size limit. View workflow artifacts for full diff]';
              }
              commentBody = `${commentHeader}\n\n⚠️ **Changes detected** in the query tool results TSV compared to \`neurobagel_examples:main\`:\n\n<details open>\n<summary><b>View TSV Diff</b></summary>\n\n\`\`\`diff\n${diffContent}\n\`\`\`\n</details>\n\n*Generated by \`preview examples diff\` workflow.*`;
            } else {
              commentBody = `${commentHeader}\n\n✅ **No changes detected** in the query tool results TSV compared to \`neurobagel_examples:main\`.\n\n*Generated by \`preview examples diff\` workflow.*`;
            }

            // Retrieve existing comments to prevent duplicates
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });

            const botComment = comments.find(c => c.body && c.body.includes('<!-- query-tool-examples-diff-preview -->'));

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: commentBody
              });
              console.log(`Updated existing comment (${botComment.id}) on PR #${prNumber}`);
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: commentBody
              });
              console.log(`Created new comment on PR #${prNumber}`);
            }

name: comment examples diff

on:
  workflow_run:
    workflows: ["preview examples diff"]
    types:
      - completed

permissions:
  actions: read
  pull-requests: write
  issues: write

jobs:
  post-comment:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: examples-diff-artifact
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: diff-artifact

      - name: Generate comment markdown
        id: prep
        run: |
          echo "pr_number=$(cat diff-artifact/pr_number.txt)" >> "$GITHUB_OUTPUT"
          COMMENT_FILE="diff-artifact/comment.md"

          if [ "$(cat diff-artifact/diff_status.txt)" = "has_diff=true" ]; then
            head -c 50000 diff-artifact/combined.diff > diff-artifact/diff_truncated.diff

            {
              echo ""
              echo "⚠️ **Changes detected** in the query tool results TSV compared to \`neurobagel_examples:main\`:"
              echo ""
              echo "<details open>"
              echo "<summary><b>View TSV Diff</b></summary>"
              echo ""
              echo '```diff'
              cat diff-artifact/diff_truncated.diff
              if [ $(wc -c < diff-artifact/combined.diff) -gt 50000 ]; then
                echo ""
                echo "... [Diff truncated due to size limit. View workflow artifacts for full diff]"
              fi
              echo '```'
              echo "</details>"
            } > "$COMMENT_FILE"
          else
            {
              echo ""
              echo "✅ **No changes detected** in the query tool results TSV compared to \`neurobagel_examples:main\`."
            } > "$COMMENT_FILE"
          fi

      - name: Generate a token
        id: generate-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.NB_BOT_ID }}
          private-key: ${{ secrets.NB_BOT_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Post or update PR comment
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          GITHUB_TOKEN: ${{ steps.generate-token.outputs.token }}
          header: query-tool-examples-diff-preview
          number: ${{ steps.prep.outputs.pr_number }}
          path: diff-artifact/comment.md
